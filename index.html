<!doctype html>
<html lang="et">
<head>

  <meta property="og:site_name" content="KASA">
  <meta property="og:locale" content="et_EE">
  <meta property="og:title" content="Arvutite ja telefonide remont Tartus – KASA">
  <meta property="og:description" content="Arvutite, sülearvutite, nutitelefonide, tahvelarvutite ja mängukonsoolide remont ja hooldus Tartus. Üle 15 aasta kogemust, kodukülastus Tartu linnas, tööle 3 kuud garantiid.">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://kasa.ee/">

  <!-- Info Google'ile: see on remonditeenus Tartus -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "KASA",
    "description": "Arvutite, sülearvutite, nutitelefonide, tahvelarvutite ja mängukonsoolide remont ja hooldus Tartus. Üle 15 aasta kogemust, kodukülastus Tartu linnas, tööle 3 kuud garantiid.",
    "url": "https://kasa.ee/",
    "image": "https://kasa.ee/img/jagamine.jpg?v=2",
    "telephone": "+37256391019",
    "address": { "@type": "PostalAddress", "addressLocality": "Tartu", "addressCountry": "EE" },
    "areaServed": { "@type": "City", "name": "Tartu" }
  }
  </script>
  <title>Arvutite ja telefonide remont Tartus – KASA</title>
  <link rel="preload" href="/fondid/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/stiil.css?v=64ac1f7a">
</head>
<body>

  <!-- ===== PÄIS ===== -->
  <header class="pais">
    <div class="sisu pais-sisu">
      <a class="logo" href="/" aria-label="KASA">
        <span class="logo-nimi"><span>K</span><span>A</span><span>S</span><span>A</span></span>
        <span class="logo-alapealkiri" data-t="logo_alapealkiri"></span>
      </a>
      <button class="menuu-nupp" aria-label="Menüü" aria-expanded="false">☰</button>
      <nav class="menuu">
        <a href="#teenused" data-t="menuu_teenused"></a>
        <a href="#kuidas" data-t="menuu_kuidas"></a>
        <a href="#minust" data-t="menuu_minust"></a>
        <a href="#nouanded" data-t="menuu_nouanded"></a>
        <a href="#kkk" data-t="menuu_kkk"></a>
        <a href="#kontakt" data-t="menuu_kontakt"></a>
      </nav>
      <div class="keel" aria-label="Keel / Language">
        <button data-keel="et">ET</button>
        <button data-keel="en">EN</button>
        <button data-keel="ru">RU</button>
        <button data-keel="fi">FI</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== SUUR PEALKIRI ===== -->
    <section class="hero">
      <div class="sisu">
        <h1 data-t="hero_pealkiri"></h1>
      </div>
    </section>

    <!-- ===== TEENUSED (seadmete kaardid tulevad failist tekstid.js) ===== -->
    <section id="teenused" class="osa">
      <div class="sisu">
        <h2 data-t="teenused_pealkiri"></h2>
        <p class="juhatus" data-t="teenused_tekst"></p>
        <div id="seadmed" class="ruudustik"></div>
      </div>
    </section>

    <!-- ===== "LEIA OMA MURE" ABILINE (mured tulevad failist tekstid.js) ===== -->
    <section id="abiline" class="osa">
      <div class="sisu">
        <h2 data-t="abiline_pealkiri"></h2>
        <p class="juhatus" data-t="abiline_tekst"></p>
        <div id="abiline-sisu" class="kaart abiline"></div>
      </div>
    </section>

    <!-- ===== KUIDAS SEE KÄIB ===== -->
    <section id="kuidas" class="osa">
      <div class="sisu">
        <h2 data-t="kuidas_pealkiri"></h2>
        <div class="ruudustik kolm">
          <div class="kaart">
            <h3 data-t="koju_pealkiri"></h3>
            <p data-t="koju_tekst"></p>
          </div>
          <div class="kaart">
            <h3 data-t="too_pealkiri"></h3>
            <p data-t="too_tekst"></p>
          </div>
          <div class="kaart">
            <h3 data-t="hind_pealkiri"></h3>
            <p data-t="hind_tekst"></p>
          </div>
          <div class="kaart">
            <h3 data-t="garantii_pealkiri"></h3>
            <p data-t="garantii_tekst"></p>
          </div>
          <div class="kaart">
            <h3 data-t="tooaeg_pealkiri"></h3>
            <p data-t="tooaeg_tekst"></p>
          </div>
          <div class="kaart">
            <h3 data-t="maksmine_pealkiri"></h3>
            <p data-t="maksmine_tekst"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== MINUST ===== -->
    <section id="minust" class="osa">
      <div class="sisu minust">
        <div class="kogemus">
          <strong>15+</strong>
          <span data-t="aastat_kogemust"></span>
        </div>
        <div>
          <h2 data-t="minust_pealkiri"></h2>
          <p data-t="minust_tekst"></p>
        </div>      </div>
    </section>

    <!-- ===== NÕUANDED (juhendid tulevad failist tekstid.js) ===== -->
    <section id="nouanded" class="osa">
      <div class="sisu">
        <h2 data-t="nouanded_pealkiri"></h2>
        <p class="juhatus" data-t="nouanded_tekst"></p>
        <div id="nouanded-nimekiri" class="ruudustik nouanded"></div>
      </div>
    </section>

    <!-- ===== KKK (küsimused tulevad failist tekstid.js) ===== -->
    <section id="kkk" class="osa">
      <div class="sisu">
        <h2 data-t="kkk_pealkiri"></h2>
        <div id="kkk-nimekiri" class="kkk"></div>
      </div>
    </section>

    <!-- ===== KONTAKT ===== -->
    <section id="kontakt" class="osa">
      <div class="sisu">
        <h2 data-t="kontakt_pealkiri"></h2>
        <p class="juhatus" data-t="kontakt_tekst"></p>
        <div class="kontakt-ala">

          <!-- Kirjutamisvorm (praegu näidis, ei saada veel midagi) -->
          <form id="vorm" class="kaart vorm">
            <h3 data-t="vorm_pealkiri"></h3>
            <div class="vorm-rida">
              <label>
                <span data-t="vorm_nimi"></span>
                <input type="text" name="nimi" required autocomplete="name">
              </label>
              <label>
                <span data-t="vorm_kontakt"></span>
                <input type="text" name="kontakt" required autocomplete="email">
              </label>
            </div>
            <label>
              <span data-t="vorm_seade"></span>
              <select id="vorm-seade" name="seade" required></select>
            </label>
            <fieldset>
              <legend data-t="vorm_viis"></legend>
              <label class="valik"><input type="radio" name="viis" value="koju"> <span data-t="vorm_viis_koju"></span></label>
              <label class="valik"><input type="radio" name="viis" value="toon"> <span data-t="vorm_viis_toon"></span></label>
              <label class="valik"><input type="radio" name="viis" value="ei-tea" checked> <span data-t="vorm_viis_ei_tea"></span></label>
            </fieldset>
            <label>
              <span data-t="vorm_kirjeldus"></span>
              <textarea name="kirjeldus" rows="5" required data-tp="vorm_kirjeldus_vihje"></textarea>
            </label>
            <!-- Robotite lõks: inimene seda lahtrit ei näe ega täida -->
            <input type="checkbox" name="botcheck" class="robotilõks" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button type="submit" class="nupp" data-t="vorm_saada"></button>
            <p class="vorm-privaatsus">
              <span data-t="vorm_privaatsus"></span>
              <a href="/privaatsus" data-t="privaatsus_link"></a>
            </p>
            <p id="vorm-teade" class="vorm-teade" hidden></p>
          </form>

          <!-- Otse ühendust võtmine -->
          <div class="kontaktid">
            <h3 data-t="voi_kirjuta_otse"></h3>
            <div class="kaart kontakt">
              <h3 data-t="telefon"></h3>
              <a data-kontakt="telefon" href="#"></a>
            </div>
            <div class="kaart kontakt">
              <h3 data-t="whatsapp"></h3>
              <a data-kontakt="whatsapp" href="#" target="_blank" rel="noopener" data-t="whatsapp_tekst"></a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== JALUS ===== -->
  <footer class="jalus">
    <div class="sisu">
      © <span id="aasta"></span> <span data-kontakt="lehe_nimi">KASA</span> · Tartu
      · <a href="/privaatsus" data-t="privaatsus_link"></a>
    </div>
  </footer>

  <script src="/js/tekstid.js?v=2be2ecc5"></script>
  <script src="/js/leht.js?v=06ee0828"></script>
  <!-- Külastuste loendur (GoatCounter, ilma küpsisteta) -->
  <script data-goatcounter="https://karelsa1992.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
